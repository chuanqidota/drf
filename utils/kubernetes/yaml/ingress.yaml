apiVersion: networking.k8s.io/v1 # API版本，表示我们使用的Kubernetes API的版本
kind: Ingress # 资源类型，这里创建的是Ingress
metadata: # 元数据部分，包含Ingress的名称、标签等信息
  name: nginx-ingress # Ingress的唯一名称
  labels: # 添加标签，方便通过label selector进行操作
    app: nginx-label # 应用的名称标签
  namespace: my-namespace # 设置Ingress的名称空间，如果不指定，默认是default
  annotations: # 定义Ingress的规则，比如SSL证书
    # 使用Nginx Ingress Controller，指定SSL证书
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec: # 规范化部分，定义Ingress的详细配置
  rules:  # 规则列表，定义了多个主机名和路径的路由规则
  -
    host: www.nginx-local.com # 主机名规则，只有请求的Host匹配时才应用下面的路径规则
    http: # HTTP路径规则，匹配请求的URL路径
      paths:
      -
        path: / # 路径规则，匹配的路径
        pathType: Prefix # 路径的后端服务配置
        backend:
          service: # 指定Service的名称和端口
            name: nginx-service
            port:
              name: http
