apiVersion: apps/v1 # API 版本，这里使用的是 v1 版本的 Deployment API
kind: Deployment # 类型，表示这是一个 Deployment 资源
metadata:
  name: nginx-deployment  # Deployment 的名称，可以根据应用或服务来命名
  namespace: default  # 所属的命名空间，默认是 "default"
  labels:
    app: nginx-label  # 可以添加任意数量的标签，用于选择和组织资源
spec:
  replicas: 3 # 希望保持运行的副本数，即 Pod 的数量
  selector: # 用于匹配 Pod 的标签选择器
    matchLabels:
      app: nginx-label  # 这里的标签必须与 Pod 模板中的标签相匹配
  template: # Pod 模板，定义了创建的每个 Pod 的配置
    metadata: # Pod 的标签
      name: Title
      labels:
        app: nginx-label # 同样，这里的标签应与上面的 selector 匹配
    spec:
      containers: # 定义容器列表，每个 Deployment 至少包含一个容器
        - name: nginx-container  # 容器的名称
          image: nginx:latest  # 容器使用的镜像，这里是 Nginx 的最新版本
          imagePullPolicy: Always # 这里表示总是重新拉取镜像
      restartPolicy: Always # Pod 创建后，如果容器退出，则如何重启容器
      