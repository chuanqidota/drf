[program:beat]
directory=/opt/drf/
environment=PATH="%(ENV_PATH)s:/usr/local/python38/bin/",profileEnv="prod",LD_LIBRARY_PATH="/usr/local/openssl/lib:/usr/local/python38/lib"
command=/opt/drf_env/bin/celery -A drf beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler --max-interval 30
pidfile=/opt/drf/beat.pid
autostart=true
autorestart=true
stdout_logfile=/opt/logs/beat.log
stderr_logfile=/opt/logs/beat.log