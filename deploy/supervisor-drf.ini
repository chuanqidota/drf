[program:drf]
directory=/opt/drf/
environment=PATH="%(ENV_PATH)s:/usr/local/python38/bin/",profileEnv="prod",LD_LIBRARY_PATH="/usr/local/openssl/lib:/usr/local/python38/lib"
command=/opt/drf_env/bin/gunicorn drf.wsgi:application --preload -c /opt/drf/drf/gunicorn.py
autostart=true
autorestart=true
stdout_logfile=/opt/logs/supervisord-panda.log
stderr_logfile=/opt/panda/logs/supervisord-panda.log