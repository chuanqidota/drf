[program:celery]
directory=/opt/drf/
environment=PATH="%(ENV_PATH)s:/usr/local/python38/bin/",profileEnv="prod",LD_LIBRARY_PATH="/usr/local/openssl/lib:/usr/local/python38/lib"
command=/opt/drf_env/bin/celery -A drf worker -l INFO -c 100
autostart=true
autorestart=true
stdout_logfile=/opt/logs/celery.log
stderr_logfile=/opt/logs/celery.log