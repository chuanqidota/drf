[eventlistener:monitor]
command=/opt/drf_env/bin/python /opt/drf/drf/monitor.py
autostart=true
autorestart=true
events=PROCESS_STATE_STOPPING,PROCESS_STATE_EXITED,PROCESS_STATE_UNKNOWN,SUPERVISOR_STATE_CHANGE,PROCESS_STATE,TICK_5
stdout_logfile=/opt/logs/monitor.log
stderr_logfile=/opt/logs/monitor.log